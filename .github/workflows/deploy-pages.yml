name: Deploy Mindmap to GitHub Pages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      app:
        # The switch between the two apps. Rolling back = running this again with the
        # other choice. Both use the same sign-in client and URL, so nothing else changes.
        description: "Which app to deploy to mindmap.thoughtful-ai.com"
        type: choice
        options:
          - current
          - next
        default: current

permissions:
  contents: read

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Require main for a deployment
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Mindmap Pages deployments must run from main." >&2
          exit 1
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next/package-lock.json
      - run: npm ci
      # Pull requests build and verify both apps; a deployment builds only the chosen one.
      - name: Build current app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app != 'next' }}
        run: npm run build:pages && npm run verify:pages
      - name: Build next app
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.app == 'next' }}
        run: npm ci --prefix next && npm run build --prefix next && node scripts/verify-pages-build.mjs next
      - name: Configure Pages
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ inputs.app == 'next' && 'next/dist' || 'dist' }}

  deploy:
    name: Deploy Pages artifact
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: mindmap-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
